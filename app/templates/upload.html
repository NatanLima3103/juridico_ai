{% extends "base.html" %}

{% block title %}Upload de documentos{% endblock %}

{% block content %}
<section class="card">
    <h2>Upload de documento</h2>
    <p>Envie um arquivo PDF ou DOCX para extração de texto.</p>

    {% if error_message %}
        <div class="erro">{{ error_message }}</div>
    {% endif %}

    <form action="/documents/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pdf,.docx" required>
        <button class="botao" type="submit">Enviar arquivo</button>
    </form>
</section>
{% endblock %}
