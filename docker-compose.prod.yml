name: juridico_ai_prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juridico_ai}
      POSTGRES_USER: ${POSTGRES_USER:-juridico_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no ambiente de producao}
    volumes:
      - juridico_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: juridico-ai:prod
    init: true
    logging: *default-logging
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      DEBUG: "false"
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-juridico_ai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-juridico_ai}}
      UPLOAD_DIR: ${UPLOAD_DIR:-storage/uploads}
      GENERATIONS_DIR: ${GENERATIONS_DIR:-storage/generations}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - juridico_ai_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  juridico_ai_postgres_data:
  juridico_ai_storage:
